<main class="perfil-page">
  <section
    class="perfil-card"
    aria-labelledby="titulo-perfil"
    [attr.aria-busy]="cargando() || guardando()"
  >
    <header class="perfil-header">
      <span class="etiqueta">SAE · Cuenta</span>

      <h1 id="titulo-perfil">Mi perfil</h1>

      <p>
        Consulta tus datos y actualiza tu nombre.
      </p>
    </header>

    <p
      *ngIf="error()"
      class="mensaje mensaje-error"
      role="alert"
    >
      {{ error() }}
    </p>

    <p
      *ngIf="exito()"
      class="mensaje mensaje-exito"
      role="status"
    >
      {{ exito() }}
    </p>

    <div *ngIf="cargando()" class="estado-carga" role="status">
      Cargando tu perfil…
    </div>

    <form
      *ngIf="!cargando() && rol() !== null"
      #formulario="ngForm"
      (ngSubmit)="guardar()"
    >
      <div class="campo">
        <label for="nombre">Nombre completo</label>

        <input
          id="nombre"
          name="nombre"
          type="text"
          autocomplete="name"
          required
          minlength="2"
          maxlength="100"
          [ngModel]="nombre()"
          (ngModelChange)="cambiarNombre($event)"
          [disabled]="guardando()"
          #campoNombre="ngModel"
          aria-describedby="ayuda-nombre"
        />

        <small id="ayuda-nombre">
          Puedes editar tu nombre. Usa entre 2 y 100 caracteres.
        </small>

        <small
          *ngIf="
            campoNombre.touched &&
            nombre().trim().length < 2
          "
          class="error-campo"
        >
          Escribe un nombre de al menos 2 caracteres.
        </small>
      </div>

      <div class="campo">
        <label for="correo">Correo electrónico</label>

        <input
          id="correo"
          type="email"
          autocomplete="email"
          [value]="correo()"
          readonly
        />
      </div>

      <div class="campo">
        <label for="rol">Rol</label>

        <input
          id="rol"
          type="text"
          [value]="rol() === 'profesor' ? 'Profesor' : 'Estudiante'"
          readonly
        />

        <small>
          El correo y el rol no se pueden modificar desde esta pantalla.
        </small>
      </div>

      <div class="acciones">
        <button
          type="button"
          class="boton boton-secundario"
          [disabled]="guardando()"
          (click)="volver()"
        >
          Volver al panel
        </button>

        <button
          type="submit"
          class="boton boton-principal"
          [disabled]="!puedeGuardar || formulario.invalid"
        >
          {{ guardando() ? 'Guardando…' : 'Guardar cambios' }}
        </button>
      </div>
    </form>

    <div
      *ngIf="!cargando() && rol() === null"
      class="acciones"
    >
      <button
        type="button"
        class="boton boton-secundario"
        (click)="volver()"
      >
        Ir al inicio de sesión
      </button>

      <button
        type="button"
        class="boton boton-principal"
        (click)="cargarPerfil()"
      >
        Reintentar
      </button>
    </div>
  </section>
</main>
